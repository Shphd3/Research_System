root: rq.expert_specialization

ui:
  layout: LR
  expanded:
    - rq.expert_specialization
    - rq.a06_functional_routing
    - rq.mtp_support
    - rq.long_context_functional_retrieval

nodes:
  - id: rq.expert_specialization
    title: When does top-1 MoE become functionally specialized?
    type: question
    summary: "Primary project question: discover, preserve, and use a route-function partition, then test whether a real workload contains stable oracle routing headroom."
    files:
      - path: /PROJECTS.md
        title: current project registry
      - path: /sync/S000_current_specialization/README.md
        title: published current-state entry
    status: active
    tags: [moe, specialization, mainline]

  - id: concept.functional_specialization
    title: Functional specialization contract
    type: concept
    summary: "Specialization requires conditional expert utility and route-function binding; balanced load or route-label agreement alone is insufficient."
    file: /Projects/from-attention-to-search/main/problem_anchors/06_geometry_proxy_preservation/06_00_functional_specialization_contract/06_00_functional_specialization_contract_anchor.md
    status: done
    tags: [definition, utility, claim-boundary]

  - id: rq.failure_mechanism
    title: Why can ordinary top-1 routing fail?
    type: question
    summary: "A05 isolates shortcut routing, early assignment lock-in, common-logit effects, and route-function mismatch as failure explanations."
    file: /Projects/from-attention-to-search/main/problem_anchors/05_failure_mechanism/research_map.md
    status: done
    tags: [a05, failure, router]

  - id: claim.ordinary_top1_insufficient
    title: Ordinary top-1 structure does not prove useful experts
    type: claim
    summary: "Controlled and real-text audits weaken the claim that ordinary top-1 routing naturally yields stable feature-level functional experts."
    file: /Projects/from-attention-to-search/main/problem_anchors/05_failure_mechanism/05_04_03_real_text_common_logit_initialization_anchor.md
    status: done
    tags: [a05, negative-evidence, boundary]

  - id: rq.a06_functional_routing
    title: Can route structure become expert utility?
    type: question
    summary: "A06 moves from route-relevant state discovery through finite-margin preservation and sparse utility discovery to the real-workload headroom gate."
    file: /Projects/from-attention-to-search/main/problem_anchors/06_geometry_proxy_preservation/research_map.md
    status: active
    tags: [a06, geometry, utility]

  - id: claim.geometry_reachable_not_preserved
    title: Route geometry is reachable but can be overwritten
    type: claim
    summary: "A controlled partition and real-DCLM proxy centers are routable at step 0, but ordinary training can erase that routing."
    file: /Projects/from-attention-to-search/main/problem_anchors/06_geometry_proxy_preservation/06_01_geometry_and_state_discovery/06_01_geometry_and_state_discovery_anchor.md
    status: done
    tags: [a06, initialization, overwrite]

  - id: claim.margin_codynamics
    title: Preservation is a finite-margin co-dynamics problem
    type: claim
    summary: "Low-tail routing margin is the local state; expert utility, signed background pressure, representation motion, router motion, and update scale jointly move it."
    file: /Projects/from-attention-to-search/main/problem_anchors/06_geometry_proxy_preservation/06_02_partition_preservation_dynamics/06_02_partition_preservation_dynamics_anchor.md
    status: done
    tags: [a06, margin, dynamics]

  - id: claim.partial_feedback_blindness
    title: Selected-only feedback can miss the useful expert
    type: claim
    summary: "In the frozen four-expert bridge, selected-only weighted top-1 preserves a correct specialist but cannot discover one from a wrong rank."
    file: /Projects/from-attention-to-search/main/problem_anchors/06_geometry_proxy_preservation/06_03_utility_binding_and_sparse_discovery/06_03_utility_binding_and_sparse_discovery_anchor.md
    status: done
    tags: [a06, sparse-feedback, utility]

  - id: method.bounded_challenger
    title: Bounded challenger with a lower-tail certificate
    type: method
    summary: "One rotating challenger supplies counterfactual utility; a lower-tail certificate switches from discovery to exploitation in the controlled four-expert system."
    file: /Projects/from-attention-to-search/main/experiments/A06/06_03_utility_binding_and_sparse_discovery/A06_03_03_E01_rotating_challenger/summary.md
    status: done
    tags: [a06, challenger, phase-switch]

  - id: rq.real_workload_headroom
    title: Does repository code contain stable oracle routing headroom?
    type: question
    summary: "Active gate: measure held-out forced-expert advantage after calibration/test separation and token, locality, load, length, frequency, and split controls."
    file: /Projects/from-attention-to-search/main/problem_anchors/06_geometry_proxy_preservation/06_04_real_workload_utility_headroom/06_04_real_workload_utility_headroom_anchor.md
    status: active
    tags: [a06, real-workload, oracle-headroom]

  - id: task.approve_a06_04_protocol
    title: Approve or reject the minimal A06_04 protocol
    type: task
    summary: "Exactly one project-level decision: settle the oracle-headroom workload gate before designing another LLM-scale Router method."
    file: /Projects/from-attention-to-search/main/problem_anchors/06_geometry_proxy_preservation/06_04_real_workload_utility_headroom/06_04_real_workload_utility_headroom_anchor.md
    status: active
    tags: [next-decision, protocol]

  - id: rq.mtp_support
    title: When does informative future supervision become useful?
    type: question
    summary: "Supporting route: A11 identifies the direct objective-level signal; A12 tests structured composition and standard-head use without replacing the MoE mainline."
    files:
      - path: /Projects/from-attention-to-search/main/problem_anchors/11_informative_future_branch_mechanism/README.md
        title: A11 registry
      - path: /Projects/from-attention-to-search/main/problem_anchors/12_structured_compositional_mtp_workload/README.md
        title: A12 registry
    status: active
    tags: [mtp, supporting-line]

  - id: claim.informative_future_signal
    title: Informative future targets provide an earlier direct signal
    type: claim
    summary: "A11 supports a controlled first-order signal and conditional shared-parameter reachability, but formation is not sufficient for later standard-head behavior."
    file: /Projects/from-attention-to-search/main/stories/11_informative_future_branch_mechanism/01_informative_future_branch_signal_and_use_boundary.md
    status: done
    tags: [a11, objective, boundary]

  - id: rq.structured_composition
    title: Does the earlier signal help structured composition?
    type: question
    summary: "A12 separates workload validity, learner capability, rank-limited interference, and causal use of an intermediate state."
    file: /Projects/from-attention-to-search/main/stories/12_structured_compositional_mtp_workload/01_structured_composition_workload_and_standard_head_use.md
    status: active
    tags: [a12, composition, standard-head]

  - id: claim.a12_operationalization_boundary
    title: Fixed-table and asymmetric carriers are insufficient
    type: claim
    summary: "E02 was positive only in the exact-fit tail, and E03 had asymmetric query-relevant structure; neither supports a clean broad-convergence mechanism claim."
    files:
      - path: /Projects/from-attention-to-search/main/problem_anchors/12_structured_compositional_mtp_workload/12_0_short_range_single_vs_two_step_composition/12_0_short_range_single_vs_two_step_composition_anchor.md
        title: A12_0 anchor
      - path: /Projects/from-attention-to-search/main/experiments/A12/12_0_short_range_single_vs_two_step_composition/A12_0_E02_in_support_capability_calibration/summary.md
        title: E02 calibration summary
    status: done
    tags: [a12, operationalization, claim-boundary]

  - id: task.decide_e04_carrier
    title: Close E04 or reopen carrier design
    type: task
    summary: "All 12 NTP trajectories completed, but no scale passed both depths and the row-removal guard was invalid. Decide whether to close E04 or reopen carrier/capability design under a new Protocol; do not run MTP."
    file: /Projects/from-attention-to-search/main/experiments/A12/12_0_short_range_single_vs_two_step_composition/A12_0_E04_balanced_per_sample_dual_map/summary.md
    status: active
    tags: [a12, next-decision, carrier-validity, mtp-blocked]

  - id: rq.long_context_functional_retrieval
    title: What makes long-context retrieval functionally useful?
    type: question
    summary: "Draft cross-line meeting question: under a fixed selection budget, which query-conditioned score preserves ordinary-head loss rather than merely retrieving an aligned or readable item?"
    files:
      - path: /daily_research_reports/0716/docs/long_context_functional_retrieval_working_theme.md
        title: English working theme
      - path: /daily_research_reports/0716/docs/long_context_functional_retrieval_working_theme_cn.md
        title: Chinese working theme
    status: draft
    tags: [long-context, retrieval, router, functional-utility]

  - id: claim.feature_alignment_not_retrieval_utility
    title: Perfect feature alignment is insufficient for sparse retrieval
    type: claim
    summary: "R3/R4 show that, in the controlled all-trigram setup, perfect feature-aligned buckets remain worse than a local same-count baseline on sparse output quality."
    files:
      - path: /Projects/from-attention-to-search/main/experiments/archive/R3_perfect_router_retrieval/summary.md
        title: R3 perfect-router result
      - path: /Projects/from-attention-to-search/main/experiments/archive/R4_attention_output_router_retrieval/summary.md
        title: R4 attention-output result
    status: done
    tags: [retrieval, negative-evidence, feature-alignment]

  - id: task.approve_functional_retrieval_audit
    title: Approve or reject the matched-budget loss-utility audit
    type: task
    summary: "After the researcher completes the human judgment fields, decide whether to compare random, local, feature, and attention-based selectors by held-out ordinary-head loss gap on existing checkpoints."
    file: /daily_research_reports/0716/docs/long_context_functional_retrieval_working_theme.md
    status: draft
    tags: [next-decision, protocol-required, long-context, router]

