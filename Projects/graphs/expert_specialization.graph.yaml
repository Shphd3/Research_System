    status: done
    tags: [evidence, shortcut]

  - id: evidence.h0531_lockin
    title: H0531 2x2 lock-in diagnostic
    type: evidence
    summary: Minimal 2-feature top-1 runs localize collapse to initial assignment rather than late training drift.
    file: /Projects/from-attention-to-search/main/experiments/A02_top1_router_lockin_2x2/summary.md
    status: done
    tags: [evidence, lock-in]

  - id: rq.slot_context_visibility
    title: Is the slot signal visible?
    type: question
    summary: Test whether slot/context information can be represented at the routed position, before asking whether the router uses it.
    file: /Projects/from-attention-to-search/main/problem_anchors/01_slot_context_dominance_router_specialization_anchor.md
    status: done
    tags: [slot-context, visibility]

