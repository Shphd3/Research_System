<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 34px 'Noto Sans CJK SC','DejaVu Sans',sans-serif; fill:#172033; }
      .subtitle { font: 600 24px 'Noto Sans CJK SC','DejaVu Sans',sans-serif; fill:#24304a; }
      .label { font: 500 20px 'Noto Sans CJK SC','DejaVu Sans',sans-serif; fill:#172033; }
      .small { font: 400 17px 'Noto Sans CJK SC','DejaVu Sans',sans-serif; fill:#44506a; }
      .note { font: 500 18px 'Noto Sans CJK SC','DejaVu Sans',sans-serif; fill:#2d3850; }
      .panel { fill:#f8fafc; stroke:#a8b3c7; stroke-width:2; rx:20; }
      .state { fill:#e8eef8; stroke:#64748b; stroke-width:2; rx:12; }
      .head { fill:#f6b26b; stroke:#b45f06; stroke-width:2; rx:12; }
      .middle { fill:#ffd966; stroke:#a67c00; stroke-width:2; rx:12; }
      .tail { fill:#93c47d; stroke:#38761d; stroke-width:2; rx:12; }
      .gate { fill:#9fc5e8; stroke:#3d85c6; stroke-width:2; rx:12; }
      .expert { fill:#d9d2e9; stroke:#674ea7; stroke-width:2; rx:12; }
      .relay { fill:#cfe2f3; stroke:#0b5394; stroke-width:3; rx:14; }
      .arrow { stroke:#475569; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .bandarrow { stroke:#9a6700; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .fullarrow { stroke:#674ea7; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" class="title">Local-HMT 与 Layer-1 Relay-HMT：限制 Gate 视图，不限制专家输入</text>
  <text x="800" y="84" text-anchor="middle" class="small">H/M/T 是按 covariance 特征值由大到小划分的 64 / 256 / 448 维方向</text>

  <!-- Local panel -->
  <rect x="35" y="115" width="745" height="650" class="panel"/>
  <text x="407" y="157" text-anchor="middle" class="subtitle">Local-HMT：每层使用自己的频带坐标</text>
  <text x="407" y="188" text-anchor="middle" class="small">问题：层内新形成的信息，能否由该层自己的 H→M→T 日程利用？</text>

  <rect x="80" y="230" width="145" height="70" class="state"/><text x="152" y="258" text-anchor="middle" class="label">L1 state</text><text x="152" y="284" text-anchor="middle" class="small">完整 r₁</text>
  <rect x="300" y="230" width="145" height="70" class="gate"/><text x="372" y="258" text-anchor="middle" class="label">Gate 1</text><text x="372" y="284" text-anchor="middle" class="small">完整视图</text>
  <rect x="570" y="230" width="150" height="70" class="expert"/><text x="645" y="258" text-anchor="middle" class="label">Expert 1</text><text x="645" y="284" text-anchor="middle" class="small">完整 r₁</text>
  <path d="M225 265 L300 265" class="arrow"/><path d="M225 285 C360 330,500 325,570 285" class="fullarrow"/>

  <rect x="80" y="340" width="145" height="70" class="state"/><text x="152" y="368" text-anchor="middle" class="label">L2 state</text><text x="152" y="394" text-anchor="middle" class="small">完整 r₂</text>
  <rect x="265" y="340" width="145" height="70" class="head"/><text x="337" y="368" text-anchor="middle" class="label">P₂,H</text><text x="337" y="394" text-anchor="middle" class="small">本层 head 64</text>
  <rect x="450" y="340" width="120" height="70" class="gate"/><text x="510" y="382" text-anchor="middle" class="label">Gate 2</text>
  <rect x="600" y="340" width="120" height="70" class="expert"/><text x="660" y="382" text-anchor="middle" class="label">Expert 2</text>
  <path d="M225 375 L265 375" class="bandarrow"/><path d="M410 375 L450 375" class="bandarrow"/><path d="M225 398 C360 440,520 440,600 398" class="fullarrow"/>

  <rect x="80" y="450" width="145" height="70" class="state"/><text x="152" y="478" text-anchor="middle" class="label">L3 state</text><text x="152" y="504" text-anchor="middle" class="small">完整 r₃</text>
  <rect x="265" y="450" width="145" height="70" class="middle"/><text x="337" y="478" text-anchor="middle" class="label">P₃,M</text><text x="337" y="504" text-anchor="middle" class="small">本层 middle 256</text>
  <rect x="450" y="450" width="120" height="70" class="gate"/><text x="510" y="492" text-anchor="middle" class="label">Gate 3</text>
  <rect x="600" y="450" width="120" height="70" class="expert"/><text x="660" y="492" text-anchor="middle" class="label">Expert 3</text>
  <path d="M225 485 L265 485" class="bandarrow"/><path d="M410 485 L450 485" class="bandarrow"/><path d="M225 508 C360 550,520 550,600 508" class="fullarrow"/>

  <rect x="80" y="560" width="145" height="70" class="state"/><text x="152" y="588" text-anchor="middle" class="label">L4 state</text><text x="152" y="614" text-anchor="middle" class="small">完整 r₄</text>
  <rect x="265" y="560" width="145" height="70" class="tail"/><text x="337" y="588" text-anchor="middle" class="label">P₄,T</text><text x="337" y="614" text-anchor="middle" class="small">本层 tail 448</text>
  <rect x="450" y="560" width="120" height="70" class="gate"/><text x="510" y="602" text-anchor="middle" class="label">Gate 4</text>
  <rect x="600" y="560" width="120" height="70" class="expert"/><text x="660" y="602" text-anchor="middle" class="label">Expert 4</text>
  <path d="M225 595 L265 595" class="bandarrow"/><path d="M410 595 L450 595" class="bandarrow"/><path d="M225 618 C360 660,520 660,600 618" class="fullarrow"/>

  <text x="407" y="705" text-anchor="middle" class="note">频带来源随层改变：P₂,H、P₃,M、P₄,T 分别由各层表征拟合</text>
  <text x="407" y="735" text-anchor="middle" class="small">优点：允许使用深层新形成的信息；风险：每层坐标含义与漂移都不同</text>

  <!-- Relay panel -->
  <rect x="820" y="115" width="745" height="650" class="panel"/>
  <text x="1192" y="157" text-anchor="middle" class="subtitle">Layer-1 Relay-HMT：后三层共享第一层频带坐标</text>
  <text x="1192" y="188" text-anchor="middle" class="small">问题：一个稳定浅层坐标，能否降低后层 Router 的搜索漂移？</text>

  <rect x="860" y="230" width="180" height="80" class="relay"/><text x="950" y="258" text-anchor="middle" class="label">L1 block output</text><text x="950" y="285" text-anchor="middle" class="small">s₁ = RMS(full output)</text>
  <rect x="1100" y="220" width="125" height="60" class="head"/><text x="1162" y="257" text-anchor="middle" class="label">P₁,H</text>
  <rect x="1100" y="300" width="125" height="60" class="middle"/><text x="1162" y="337" text-anchor="middle" class="label">P₁,M</text>
  <rect x="1100" y="380" width="125" height="60" class="tail"/><text x="1162" y="417" text-anchor="middle" class="label">P₁,T</text>
  <path d="M1040 270 C1070 270,1070 250,1100 250" class="bandarrow"/>
  <path d="M1040 270 C1070 270,1070 330,1100 330" class="bandarrow"/>
  <path d="M1040 270 C1070 270,1070 410,1100 410" class="bandarrow"/>

  <rect x="1280" y="220" width="120" height="60" class="gate"/><text x="1340" y="257" text-anchor="middle" class="label">Gate 2</text>
  <rect x="1280" y="300" width="120" height="60" class="gate"/><text x="1340" y="337" text-anchor="middle" class="label">Gate 3</text>
  <rect x="1280" y="380" width="120" height="60" class="gate"/><text x="1340" y="417" text-anchor="middle" class="label">Gate 4</text>
  <path d="M1225 250 L1280 250" class="bandarrow"/><path d="M1225 330 L1280 330" class="bandarrow"/><path d="M1225 410 L1280 410" class="bandarrow"/>

  <rect x="870" y="490" width="140" height="58" class="state"/><text x="940" y="526" text-anchor="middle" class="label">完整 r₂</text>
  <rect x="1070" y="490" width="120" height="58" class="expert"/><text x="1130" y="526" text-anchor="middle" class="label">Expert 2</text>
  <rect x="870" y="565" width="140" height="58" class="state"/><text x="940" y="601" text-anchor="middle" class="label">完整 r₃</text>
  <rect x="1070" y="565" width="120" height="58" class="expert"/><text x="1130" y="601" text-anchor="middle" class="label">Expert 3</text>
  <rect x="870" y="640" width="140" height="58" class="state"/><text x="940" y="676" text-anchor="middle" class="label">完整 r₄</text>
  <rect x="1070" y="640" width="120" height="58" class="expert"/><text x="1130" y="676" text-anchor="middle" class="label">Expert 4</text>
  <path d="M1010 519 L1070 519" class="fullarrow"/><path d="M1010 594 L1070 594" class="fullarrow"/><path d="M1010 669 L1070 669" class="fullarrow"/>

  <text x="1330" y="510" text-anchor="middle" class="small">Gate 只看 s₁ 的 H/M/T</text>
  <text x="1330" y="540" text-anchor="middle" class="small">专家仍看各自完整 r₂/r₃/r₄</text>
  <text x="1192" y="705" text-anchor="middle" class="note">频带来源固定为第一层：P₁,H→L2，P₁,M→L3，P₁,T→L4</text>
  <text x="1192" y="735" text-anchor="middle" class="small">优点：统一坐标；风险：第一层无法预见后层才形成的组合变量</text>

  <rect x="60" y="790" width="1480" height="80" fill="#fff7e6" stroke="#d6a24c" stroke-width="2" rx="14"/>
  <text x="800" y="822" text-anchor="middle" class="note">2B 完成实验：分叉时冻结频带投影；10B 在线实验：保持同一 Local/Relay 来源关系，但用独立统计语料动态更新投影，并用连续性守卫限制刷新冲击。</text>
  <text x="800" y="852" text-anchor="middle" class="small">两种架构都只改变 Router 的观测坐标；它们不会减少专家接收的本层完整信息。</text>
</svg>
